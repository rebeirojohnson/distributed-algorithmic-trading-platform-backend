[project]
name = "distributed-trading-platform"
version = "0.1.0"
description = "Distributed paper-trading platform backend"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "passlib[argon2]>=1.7.4,<2",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "python-json-logger>=3.2,<4",
    "redis[hiredis]>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests/unit"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "passlib", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

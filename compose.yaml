name: trading-platform

x-app-environment: &app-environment
  TRADING_ENVIRONMENT: development
  TRADING_LOG_LEVEL: ${TRADING_LOG_LEVEL:-INFO}
  TRADING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trading}
  TRADING_REDIS_URL: redis://redis:6379/0
  TRADING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TRADING_JWT_SECRET: ${TRADING_JWT_SECRET:-development-only-change-me-32chars}
  TRADING_JWT_ISSUER: ${TRADING_JWT_ISSUER:-trading-platform}
  TRADING_JWT_AUDIENCE: ${TRADING_JWT_AUDIENCE:-trading-platform-api}
  TRADING_MARKET_DATA_URL: http://market-data:8000
  TRADING_ORDERS_URL: http://orders:8000
  TRADING_PORTFOLIO_URL: http://portfolio:8000

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: trading-platform:local
  restart: unless-stopped
  environment: *app-environment
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    user: "0:0"
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  market-data:
    <<: *app
    command: ["uvicorn", "trading_platform.market_data.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      TRADING_SERVICE_NAME: market-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  orders:
    <<: *app
    command: ["uvicorn", "trading_platform.orders.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      TRADING_SERVICE_NAME: orders
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  portfolio:
    <<: *app
    command: ["uvicorn", "trading_platform.portfolio.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      TRADING_SERVICE_NAME: portfolio
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    <<: *app
    command: ["uvicorn", "trading_platform.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      TRADING_SERVICE_NAME: gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      market-data:
        condition: service_healthy
      orders:
        condition: service_healthy
      portfolio:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
